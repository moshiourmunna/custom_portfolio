<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers | Islam Textile Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-backdrop" data-nav-backdrop hidden></div>
  <div class="admin-shell">
    <header class="admin-nav">
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="admin-sidebar" aria-label="Open menu"><span></span></button>
      <a class="admin-nav__brand" href="dashboard.html" aria-label="Islam Textile admin home">
        <span class="admin-nav__mark" aria-hidden="true"></span>
        <span class="admin-nav__word"><strong>Islam Textile</strong><small>Weaving Tradition, Ensuring Quality</small></span>
      </a>
      <div class="admin-nav__tools">
        <a class="admin-nav__bell" href="inquiries.html" aria-label="Inquiries"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4.2 1.2 5.5 1.2 5.5H5.3S6.5 13.7 6.5 9.5z"/><path d="M10 18.5a2 2 0 0 0 4 0"/></svg><span class="admin-nav__badge">0</span></a>
        <div class="admin-nav__user"><span class="admin-nav__user-text"><strong>Admin</strong><small>Super Admin</small></span><span class="admin-nav__avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="9" r="3"/><path d="M6 19v-.5A4.5 4.5 0 0 1 10.5 14h3A4.5 4.5 0 0 1 18 18.5V19"/></svg></span></div>
      </div>
    </header>
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top"><h1>Careers</h1><a class="btn btn-primary" href="career-form.html">Add job</a></header>
      <div class="admin-content">
        <div class="toolbar">
          <input type="search" data-list-search="careers" placeholder="Search jobs…" aria-label="Search jobs">
          <select data-list-status="careers" aria-label="Status"><option value="">All statuses</option><option>Open</option><option>Closed</option></select>
        </div>
        <p class="list-meta" data-list-count="careers"></p>
        <div class="panel"><table class="table"><thead><tr><th>Image</th><th>Title</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody data-list="careers"></tbody></table></div>
        <div class="panel">
          <h2>Applications</h2>
          <p class="hint">Read-only demo. Nothing is invented here.</p>
          <table class="table"><thead><tr><th>Name</th><th>Role</th><th>Date</th></tr></thead><tbody data-list="applications"></tbody></table>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/js/admin-store.js"></script>
  <script src="assets/js/admin-ui.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
