<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiries | Islam Textile Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-backdrop" data-nav-backdrop hidden></div>
  <div class="admin-shell">
    <header class="admin-nav">
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="admin-sidebar" aria-label="Open menu"><span></span></button>
      <a class="admin-nav__brand" href="dashboard.html" aria-label="Islam Textile admin home">
        <span class="admin-nav__mark" aria-hidden="true"></span>
        <span class="admin-nav__word"><strong>Islam Textile</strong><small>Weaving Tradition, Ensuring Quality</small></span>
      </a>
      <div class="admin-nav__tools">
        <a class="admin-nav__bell" href="inquiries.html" aria-label="Inquiries"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4.2 1.2 5.5 1.2 5.5H5.3S6.5 13.7 6.5 9.5z"/><path d="M10 18.5a2 2 0 0 0 4 0"/></svg><span class="admin-nav__badge">0</span></a>
        <div class="admin-nav__user"><span class="admin-nav__user-text"><strong>Admin</strong><small>Super Admin</small></span><span class="admin-nav__avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="9" r="3"/><path d="M6 19v-.5A4.5 4.5 0 0 1 10.5 14h3A4.5 4.5 0 0 1 18 18.5V19"/></svg></span></div>
      </div>
    </header>
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top catalog-top">
        <div>
          <h1>Inquiries</h1>
          <p class="catalog-crumb"><a href="dashboard.html">Dashboard</a><span aria-hidden="true">/</span>Inquiries</p>
        </div>
        <a class="btn btn-outline" href="../public-site/contact.html" target="_blank" rel="noopener">View contact</a>
      </header>
      <div class="admin-content catalog-page">
        <div class="list-stats" data-list-stats="inquiries"></div>
        <nav class="related-links" aria-label="Related editors">
          <a href="page-contact.html">Contact copy</a>
          <a href="settings.html">Contact details</a>
          <a href="page-legal.html">Privacy</a>
        </nav>
        <section class="catalog-card" aria-label="Inquiry inbox">
          <div class="catalog-filters">
            <label class="catalog-search">
              <input type="search" data-list-search="inquiries" placeholder="Search company, interest, or message…" aria-label="Search inquiries">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            </label>
            <select data-list-status="inquiries" aria-label="Status"><option value="">Select status</option><option>New</option><option>In progress</option><option>Closed</option></select>
            <button type="button" class="btn btn-outline btn--labeled catalog-reset" data-list-reset="inquiries">Reset</button>
            <button type="button" class="btn btn-primary btn--labeled catalog-filter" data-list-filter="inquiries">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg>
              Filter
            </button>
          </div>
          <p class="catalog-note">Status changes stay in this browser. The public contact form is not rewritten.</p>
          <div class="catalog-bulk" data-list-bulk="inquiries" hidden>
            <span data-list-selected="inquiries">0 selected</span>
            <button type="button" class="set-mini set-mini--danger" data-list-bulk-delete="inquiries">Delete selected</button>
          </div>
          <div class="catalog-table-wrap">
            <table class="catalog-table">
              <thead>
                <tr>
                  <th><input type="checkbox" data-list-all="inquiries" aria-label="Select all on this page"></th>
                  <th>Image</th>
                  <th>Company</th>
                  <th>Interest</th>
                  <th>Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody data-list="inquiries" data-list-layout="catalog"></tbody>
            </table>
          </div>
          <div class="catalog-foot">
            <p data-list-count="inquiries">Showing 0 results</p>
            <div class="catalog-pager">
              <label>Rows
                <select data-page-size="inquiries" aria-label="Rows per page">
                  <option>5</option>
                  <option selected>10</option>
                  <option>25</option>
                </select>
              </label>
              <div data-list-pages="inquiries"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="assets/js/admin-store.js"></script>
  <script src="assets/js/admin-ui.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
