<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Islam Textile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="login-page">
  <form class="login-card" action="dashboard.html" method="get">
    <img src="assets/images/brand/logo-02-wordmark-woven.png" alt="Islam Textile">
    <h1>Admin Panel</h1>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="admin@islamtextile.com" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="demo" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
    <p class="muted" style="margin-top:1rem">Static demo — auth wired in Prompt 3 (Laravel).</p>
  </form>
</body>
</html>
