<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News article | Islam Textile Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="admin-backdrop" data-nav-backdrop hidden></div>
  <div class="admin-shell">
    <header class="admin-nav">
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="admin-sidebar" aria-label="Open menu"><span></span></button>
      <a class="admin-nav__brand" href="dashboard.html" aria-label="Islam Textile admin home">
        <span class="admin-nav__mark" aria-hidden="true"></span>
        <span class="admin-nav__word"><strong>Islam Textile</strong><small>Weaving Tradition, Ensuring Quality</small></span>
      </a>
      <div class="admin-nav__tools">
        <a class="admin-nav__bell" href="inquiries.html" aria-label="Inquiries"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4.2 1.2 5.5 1.2 5.5H5.3S6.5 13.7 6.5 9.5z"/><path d="M10 18.5a2 2 0 0 0 4 0"/></svg><span class="admin-nav__badge">0</span></a>
        <div class="admin-nav__user"><span class="admin-nav__user-text"><strong>Admin</strong><small>Super Admin</small></span><span class="admin-nav__avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="9" r="3"/><path d="M6 19v-.5A4.5 4.5 0 0 1 10.5 14h3A4.5 4.5 0 0 1 18 18.5V19"/></svg></span></div>
      </div>
    </header>
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top"><h1>News article</h1><a class="btn btn-outline" href="news.html">Back to list</a></header>
      <div class="admin-content">
        <form class="panel" data-record="news">
          <div class="form-grid two">
            <div class="field"><label>Title</label><input name="title" data-required data-slug-source></div>
            <div class="field"><label>Slug</label><input name="slug" data-slug></div>
            <div class="field"><label>Date</label><input name="date" type="date"></div>
            <div class="field"><label>Status</label><select name="status"><option>Published</option><option>Draft</option></select></div>
                        <div class="field"><label>Cover</label><div class="image-pick" data-image-field><img alt="" data-preview hidden><input type="hidden" name="cover"><button type="button" class="btn btn-outline" data-pick-image>Choose image</button></div><span class="hide-note">Hidden on the site when empty</span></div>
          </div>
          <div class="field"><label>Lead</label><textarea name="lead" rows="3"></textarea><span class="hide-note">Hidden on the site when empty</span></div>
          <div class="field"><label>Body</label><textarea name="body" rows="8"></textarea></div>
                  <div class="save-bar"><button class="btn btn-primary" type="submit">Save</button><span class="unsaved" data-unsaved hidden>Unsaved changes</span><span class="hint">Saved in this browser only. Public pages are not rewritten.</span></div>
        </form>
      </div>
    </div>
  </div>
  <script src="assets/js/admin-store.js"></script>
  <script src="assets/js/admin-ui.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
